name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'scripts/build_docs.ps1'
      - 'scripts/build_api_docs.py'
      - 'Testing/test_api_docs.py'
      - 'src/**'
      - 'libuxplay'
      - 'libuxplay/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'scripts/build_docs.ps1'
      - 'scripts/build_api_docs.py'
      - 'Testing/test_api_docs.py'
      - 'src/**'
      - 'libuxplay'
      - 'libuxplay/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: build API reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Generate API reference
        run: |
          python3 -m unittest discover -s Testing -p test_api_docs.py
          python3 scripts/build_api_docs.py --force
          python3 scripts/build_api_docs.py --check

      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: |
            build/doxygen/app
            build/doxygen/libuxplay
            build/doxygen/api-diff.md
            build/doxygen/api-diff.json
          retention-days: 14
