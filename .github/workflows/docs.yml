name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'scripts/build_docs.ps1'
      - 'src/**'
      - 'libuxplay'
      - 'libuxplay/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'scripts/build_docs.ps1'
      - 'src/**'
      - 'libuxplay'
      - 'libuxplay/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: build API reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Generate API reference
        run: |
          mkdir -p build/doxygen libuxplay/build/doxygen
          (cd libuxplay && doxygen Doxyfile)
          cp -a libuxplay/build/doxygen/libuxplay build/doxygen/
          doxygen Doxyfile
          test -f build/doxygen/app/index.html
          test -f build/doxygen/libuxplay/index.html
          test -f build/doxygen/libuxplay/libuxplay.tag
          for warnings in doxygen-warnings.log libuxplay/doxygen-warnings.log; do
            if [ -s "$warnings" ]; then
              cat "$warnings" >&2
              exit 1
            fi
          done

      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: |
            build/doxygen/app
            build/doxygen/libuxplay
          retention-days: 14
