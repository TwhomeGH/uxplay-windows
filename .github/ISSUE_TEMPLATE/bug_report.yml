name: Bug report
description: Report an AirPlay connection, video, audio, or diagnostics issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. In the app, use **Save Diagnostics** (main
        window or tray) and attach the generated `.zip`. It contains
        redacted logs, settings, recent events, and metrics; review it
        before sharing.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the symptom and whether it is reproducible.
      placeholder: The video froze after reconnecting, audio was delayed...
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - AirPlay mirroring
        - USB Clean Output
        - Both / not sure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version and commit
      description: From the diagnostics manifest, the log header, or the release name.
      placeholder: 2.1.0 / abc1234
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: iPad/iPhone model and iOS version
      placeholder: iPad13,18 / iOS 27.3

  - type: textarea
    id: audio-video
    attributes:
      label: Audio or video symptoms
      description: Include delay, crackling, silence, dropped frames, or A/V sync details.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: Drag the `.zip` here or paste its filename and location.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed the diagnostics bundle before sharing.
          required: true
